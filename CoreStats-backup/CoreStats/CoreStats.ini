MeterStyle=StyleValue
X=18
Y=320
FontSize=10
Text=SWAP

[MeterSwapTrack]
Meter=Shape
X=62
Y=327
Shape=Rectangle 0,0,#BarW#,6,3 | Fill Color #TrackColor# | StrokeWidth 0

[MeterSwapBar]
Meter=Shape
X=62
Y=327
DynamicVariables=1
Shape=Rectangle 0,0,[MeasureSwapBar],6,3 | Fill LinearGradient BarGrad | StrokeWidth 0
BarGrad=0 | #Accent1# ; 0.0 | #Accent2# ; 1.0

[MeterSwapPct]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureSwapPct
X=(#W#-18)
Y=320
FontSize=10
StringAlign=Right
NumOfDecimals=0
Text=%1%

[MeterSwapDetail]

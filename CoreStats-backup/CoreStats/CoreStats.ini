MeterStyle=StyleLabel
MeasureName=MeasureSwap
MeasureName2=MeasureSwapTotal
X=62
Y=338
StringStyle=Normal
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B

[MeterDiv2]
Meter=Shape
X=18
Y=368
Shape=Rectangle 0,0,(#W#-36),1 | Fill Color #DividerColor# | StrokeWidth 0

; ---------- Network ----------
[MeterNetLabel]
Meter=String
MeterStyle=StyleLabel
X=18
Y=380

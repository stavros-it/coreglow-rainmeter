[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#@#Variables.inc"]

[Metadata]
Name=CoreStats
Author=Stavros
Information=Modern system monitor: CPU, RAM, SWAP, Core Temp (temp, power, clock), network and uptime. Requires Core Temp running.
Version=1.0
License=CC BY-NC-SA 4.0

@Include=#@#Variables.inc

; ============================================================
;  MEASURES
; ============================================================

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m

[MeasureWeather]
Measure=WebParser
URL=https://wttr.in/#WeatherLoc#?format=%c|%t|%C|%h|%w|%f&m
CodePage=65001
RegExp=(?s)^(.*?)\s*\|\+?(.*?)\|\s*(.*?)\s*\|(.*?)\|\D*(\d+)\s*km/h\|\+?(.*?)\s*$
; refresh every 15 minutes
UpdateRate=900
OnConnectErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]
OnRegExpErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]

[MeasureWIcon]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureWTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWDesc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureWHum]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4

[MeasureWWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=5

[MeasureWFeels]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=6
; ---------- Core Temp ----------
[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
MinValue=0
MaxValue=100
IfCondition=MeasureTemp >= #TempHot#
IfTrueAction=[!SetOption MeterTempRing LineColor "#TempHotColor#"]
IfCondition2=(MeasureTemp >= #TempWarn#) && (MeasureTemp < #TempHot#)
IfTrueAction2=[!SetOption MeterTempRing LineColor "#TempWarnColor#"]
IfCondition3=MeasureTemp < #TempWarn#
IfTrueAction3=[!SetOption MeterTempRing LineColor "#TempOk#"]

[MeasurePower]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Power

[MeasureClock]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuSpeed

; ---------- Session statistics (tooltips) ----------
[MeasureCPUMin]
Measure=Calc
Formula=(Counter <= 2) ? MeasureCPU : Min(MeasureCPU, MeasureCPUMin)

[MeasureCPUMax]
Measure=Calc
Formula=Max(MeasureCPU, MeasureCPUMax)

[MeasureCPUAvg]
Measure=Calc
Formula=MeasureCPU
; rolling average over the last hour (3600 x 1s)
AverageSize=3600

[MeasureTempMin]
Measure=Calc
Formula=(Counter <= 2) || (MeasureTempMin <= 0) ? MeasureTemp : Min(MeasureTemp, MeasureTempMin)

[MeasureTempMax]
Measure=Calc
Formula=Max(MeasureTemp, MeasureTempMax)

[MeasureTempAvg]
Measure=Calc
Formula=MeasureTemp
AverageSize=3600

; ---------- Memory ----------
[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? (MeasureRAM / MeasureRAMTotal * 100) : 0

[MeasureRAMBar]
Measure=Calc
Formula=Max(MeasureRAMPct * #BarW# / 100, 6)

[MeasureSwap]
Measure=SwapMemory

[MeasureSwapTotal]
Measure=SwapMemory
Total=1

[MeasureSwapPct]
Measure=Calc
Formula=MeasureSwapTotal > 0 ? (MeasureSwap / MeasureSwapTotal * 100) : 0

[MeasureSwapBar]
Measure=Calc
Formula=Max(MeasureSwapPct * #BarW# / 100, 6)

; ---------- Network ----------
[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureIP]
Measure=WebParser
URL=https://api.ipify.org
RegExp=(?siU)^(.*)$
StringIndex=1
; refresh every 10 minutes (600 x 1s)
UpdateRate=600
OnConnectErrorAction=[!SetOption MeterIP Text "offline"]

; ============================================================
;  STYLES
; ============================================================

[StyleLabel]
FontFace=#Font#
FontSize=9
FontColor=#LabelColor#
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[StyleValue]
FontFace=#Font#
FontSize=11
FontColor=#TextColor#
AntiAlias=1

[StyleBig]
FontFace=#FontLight#
FontSize=18
FontColor=#TextColor#
StringAlign=CenterCenter
AntiAlias=1

[StyleRing]
W=100
H=100
StartAngle=4.712
RotationAngle=6.283
LineStart=37
LineLength=44
Solid=1
AntiAlias=1

[StyleTrack]
Shape=Ellipse 50,50,40.5 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #TrackColor#

; ============================================================
;  METERS
; ============================================================

[MeterBg]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#W#-1),498,#Radius# | Fill LinearGradient BgGrad | StrokeWidth 1 | Stroke Color #BorderColor#
BgGrad=135 | #BgColor# ; 0.0 | 28,24,44,215 ; 1.0

; ---------- Header ----------
[MeterDot]
Meter=Shape
X=18
Y=20
Shape=Ellipse 4,4,4 | Fill LinearGradient DotGrad | StrokeWidth 0
DotGrad=0 | #Accent1# ; 0.0 | #Accent2# ; 1.0

[MeterHost]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureHost
X=32
Y=13
StringStyle=Bold

[MeterUptime]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureUptime
X=(#W#-18)
Y=13
StringAlign=Right
FontColor=#LabelColor#
Text=UP  %1
ToolTipText=Windows uptime

[MeterWeather]
Meter=String
MeterStyle=StyleValue
FontSize=9
MeasureName=MeasureWIcon
X=(#W#/2)
Y=52
W=(#W#-30)
ClipString=1
StringAlign=Center
FontColor=#Accent1#
Text=%1 T: %2 | %3 | H: %4 | W: %5 km/h
ToolTipText=Feels like [MeasureWFeels]  ·  #WeatherLoc# (wttr.in) - click for forecast
LeftMouseUpAction=["https://wttr.in/#WeatherLoc#"]

; ---------- CPU ring ----------
MeasureName3=MeasureWDesc
MeasureName2=MeasureWTemp
MeasureName4=MeasureWHum
DynamicVariables=1
MeasureName5=MeasureWWind

[MeterCPUTrack]
Meter=Shape
MeterStyle=StyleTrack
X=30
Y=79

[MeterCPURing]
Meter=Roundline
MeterStyle=StyleRing
MeasureName=MeasureCPU
X=30
Y=79
LineColor=#Accent1#
ToolTipText=CPU since load  ·  min [MeasureCPUMin:0]%  ·  avg (1h) [MeasureCPUAvg:0]%  ·  max [MeasureCPUMax:0]%
DynamicVariables=1

[MeterCPUText]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureCPU
X=80
Y=129
Text=%1%
NumOfDecimals=0

[MeterCPULabel]
Meter=String
MeterStyle=StyleLabel
X=80
Y=186
StringAlign=Center
Text=CPU

; ---------- Temp ring ----------
[MeterTempTrack]
Meter=Shape
MeterStyle=StyleTrack
X=170
Y=79

[MeterTempRing]
Meter=Roundline
MeterStyle=StyleRing
MeasureName=MeasureTemp
X=170
Y=79
LineColor=#TempOk#
ToolTipText=Max temp since load  ·  min [MeasureTempMin:0]°  ·  avg (1h) [MeasureTempAvg:0]°  ·  max [MeasureTempMax:0]°
DynamicVariables=1

[MeterTempText]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureTemp
X=220
Y=129
Text=%1°
NumOfDecimals=0

[MeterTempLabel]
Meter=String
MeterStyle=StyleLabel
X=220
Y=186
StringAlign=Center
Text=Max Temp

; ---------- Power / Clock ----------
[MeterPower]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasurePower
X=80
Y=212
StringAlign=Center
NumOfDecimals=1
Text=⚡ %1 W
ToolTipText=CPU package power (Core Temp)

[MeterClock]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureClock
X=220
Y=212
StringAlign=Center
NumOfDecimals=0
Text=◷ %1 MHz
ToolTipText=Current CPU clock (Core Temp)

[MeterDiv1]
Meter=Shape
X=18
Y=246
Shape=Rectangle 0,0,(#W#-36),1 | Fill Color #DividerColor# | StrokeWidth 0

; ---------- Memory ----------
[MeterMemLabel]
Meter=String
MeterStyle=StyleLabel
X=18
Y=258
Text=Memory

; RAM
[MeterRAMLabel]
Meter=String
MeterStyle=StyleValue
X=18
Y=278
FontSize=10
Text=RAM

[MeterRAMTrack]
Meter=Shape
X=62
Y=285
Shape=Rectangle 0,0,#BarW#,6,3 | Fill Color #TrackColor# | StrokeWidth 0

[MeterRAMBar]
Meter=Shape
X=62
Y=285
DynamicVariables=1
Shape=Rectangle 0,0,[MeasureRAMBar],6,3 | Fill LinearGradient BarGrad | StrokeWidth 0
BarGrad=0 | #Accent1# ; 0.0 | #Accent2# ; 1.0

[MeterRAMPct]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAMPct
X=(#W#-18)
Y=278
FontSize=10
StringAlign=Right
NumOfDecimals=0
Text=%1%

[MeterRAMDetail]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureRAM
MeasureName2=MeasureRAMTotal
X=62
Y=296
StringStyle=Normal
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B

; SWAP
[MeterSwapLabel]

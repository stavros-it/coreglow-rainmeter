[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#@#Variables.inc"]
; Accent presets are shared with Coreglow (Accent.lua writes them to Variables.inc)
ContextTitle2=Accent: Coreglow (default)
ContextAction2=[!CommandMeasure MeasureAccentScript "SetAccent(1)"]
ContextTitle3=Accent: Emerald
ContextAction3=[!CommandMeasure MeasureAccentScript "SetAccent(2)"]
ContextTitle4=Accent: Sunset
ContextAction4=[!CommandMeasure MeasureAccentScript "SetAccent(3)"]
ContextTitle5=Accent: Rose
ContextAction5=[!CommandMeasure MeasureAccentScript "SetAccent(4)"]
ContextTitle6=Accent: Mono
ContextAction6=[!CommandMeasure MeasureAccentScript "SetAccent(5)"]
MouseOverAction=[!SetVariable Border "#Accent1#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetVariable Border "#BorderColor#"][!UpdateMeter MeterBg][!Redraw]

[Metadata]
Name=Coreglow Lumen
Author=Stavros Antoniou
Information=Coreglow Lumen - large-type card layout of Coreglow: same data and size, text sized for comfortable reading on Full HD.
Version=1.0
License=MIT

@Include=#@#Variables.inc
@Include2=#@#ThemeState.inc
@Include3=#@#Theme#IsLight#.inc
@Include4=#@#Lumen\State.inc

[Variables]
; Same footprint as Coreglow: PW x FullH (collapsed: MiniH)
FullH=691
MiniH=316
PBarW=(#PW#-40)
PingHost=1.1.1.1
Border=#BorderColor#
; Text font is the reading-optimized optical size of Segoe UI Variable; Display is kept for big numbers
FontText=Segoe UI Variable Text
; accent dot button (radius / hover ring)
DotR=5
DotRing=0,0,0,0
; ring colors (alerts change them with !SetVariable)
CPURingColor=#Accent1#
TempRingColor=#TempOk#
WiFiRowH=0
WiFiColor=#Accent1#
WiFiBar1=#TrackColor#
WiFiBar2=#TrackColor#
WiFiBar3=#TrackColor#
WiFiBar4=#TrackColor#
BattRowH=0
BattColor=#Accent1#
BattFill=#Accent1#
BattACLineText=On AC power

; Lumen colors per theme (more opaque panel and brighter labels than Coreglow, for contrast)
@Include5=#@#Lumen\Theme#IsLight#.inc

; ============================================================
;  MEASURES
; ============================================================

[MeasureTheme]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
RegValue=AppsUseLightTheme
UpdateDivider=5
IfCondition=(MeasureTheme = 1) && (#IsLight# = 0)
IfTrueAction=[!WriteKeyValue Variables IsLight 1 "#@#ThemeState.inc"][!Refresh]
IfCondition2=(MeasureTheme = 0) && (#IsLight# = 1)
IfTrueAction2=[!WriteKeyValue Variables IsLight 0 "#@#ThemeState.inc"][!Refresh]

[MeasureCollapsedInit]
Measure=Calc
Formula=#LumenCollapsed#
UpdateDivider=-1
IfCondition=MeasureCollapsedInit = 1
IfTrueAction=[!HideMeterGroup Details]

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureTime]
Measure=Time
Format=%H:%M  ·  %a %#d %b

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m

[MeasureWeather]
Measure=WebParser
; empty WeatherLoc = wttr.in detects the location from the public IP; empty WeatherUnits = units of that region
URL=https://wttr.in/#WeatherLoc#?format=%c|%t|%C|%h|%w|%f|%l&#WeatherUnits#
CodePage=65001
RegExp=(?s)^(.*?)\s*\|\+?(.*?)\|\s*(.*?)\s*\|(.*?)\|\s*(\D*?)\s*(\d+)\s*(.*?)\|\+?(.*?)\|\s*(.*?)\s*$
; refresh every 15 minutes
UpdateRate=900
OnConnectErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]
OnRegExpErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]

[MeasureWIcon]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureWTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWDesc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureWHum]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4

[MeasureWWindDir]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=5

[MeasureWWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=6

[MeasureWWindUnit]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=7
Substitute="km/h":"km"

[MeasureWFeels]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=8

[MeasureWLoc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=9

[MeasureAccentScript]
Measure=Script
ScriptFile=#@#Accent.lua
UpdateDivider=-1

[MeasureCoresScript]
Measure=Script
ScriptFile=#@#Cores.lua
UpdateDivider=-1

[MeasureCPU]
Measure=CPU
Processor=0


[MeasureCPUName]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuName
; strip the codename, e.g. "Intel Core i7 2600 (Sandy Bridge)" -> "Intel Core i7 2600"
RegExpSubstitute=1
Substitute="^(.*?)\s*(?:\(.*\)|\b(?:Sandy Bridge|Ivy Bridge|Haswell|Broadwell|Skylake|Kaby Lake|Coffee Lake|Comet Lake|Rocket Lake|Alder Lake|Raptor Lake|Lynnfield|Clarkdale|Nehalem|Westmere|Gulftown|Bloomfield|Wolfdale|Yorkfield|Conroe|Penryn|Zen\+?|Zen [2-5]|Vermeer|Matisse|Raphael|Summit Ridge|Pinnacle Ridge|Piledriver|Bulldozer|Vishera|Trinity|Richland|Kaveri|Thuban|Deneb))\s*$":"\1"

[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
MinValue=0
MaxValue=100
IfCondition=(MeasureTemp >= #TempWarn#) && (MeasureTemp < #TempHot#)
IfTrueAction=[!SetVariable TempRingColor "#TempWarnColor#"]
IfCondition2=MeasureTemp < #TempWarn#
IfTrueAction2=[!SetVariable TempRingColor "#TempOk#"]

; ---------- Alerts ----------
; temp >= TempHot: ring blinks between TempHotColor and TempHotDim (1 = bright, 0 = dim, -1 = not hot)
[MeasureTempAlert]
Measure=Calc
Formula=(MeasureTemp >= #TempHot#) ? ((MeasureTempAlert = 1) ? 0 : 1) : -1
IfCondition=MeasureTempAlert = 1
IfTrueAction=[!SetVariable TempRingColor "#TempHotColor#"]
IfCondition2=MeasureTempAlert = 0
IfTrueAction2=[!SetVariable TempRingColor "#TempHotDim#"]

; CPU >= LoadAlert for LoadAlertSecs seconds: CPU ring + label turn red
[MeasureLoadHigh]
Measure=Calc
Formula=(MeasureCPU >= #LoadAlert#) ? Min(MeasureLoadHigh + 1, 9999) : 0
IfCondition=MeasureLoadHigh >= #LoadAlertSecs#
IfTrueAction=[!SetVariable CPURingColor "#TempHotColor#"][!SetOption MeterCPULabel Text "⚠ CPU"][!SetOption MeterCPULabel FontColor "#TempHotColor#"]
IfFalseAction=[!SetVariable CPURingColor "#Accent1#"][!SetOption MeterCPULabel Text "CPU"][!SetOption MeterCPULabel FontColor "#LabelColor#"]

[MeasurePower]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Power

[MeasureClock]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuSpeed

[MeasureTopProc]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Blacklist=_Total|Idle

[MeasureTopPct]
Measure=Calc
Formula=MeasureTopProc

; ---------- GPU (Windows counters, no extra software) ----------
[MeasureGPURaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0

[MeasureGPU]
Measure=Calc
Formula=Min(MeasureGPURaw, 100)
MinValue=0
MaxValue=100

[MeasureVRAM]
Measure=Plugin
Plugin=UsageMonitor
Alias=VRAM
Index=0

; ---------- Session statistics (tooltips) ----------
[MeasureCPUMin]
Measure=Calc
Formula=(Counter <= 2) ? MeasureCPU : Min(MeasureCPU, MeasureCPUMin)

[MeasureCPUMax]
Measure=Calc
Formula=Max(MeasureCPU, MeasureCPUMax)

[MeasureCPUAvg]
Measure=Calc
Formula=MeasureCPU
; rolling average over the last hour (3600 x 1s)
AverageSize=3600

[MeasureTempMin]
Measure=Calc
Formula=(Counter <= 2) || (MeasureTempMin <= 0) ? MeasureTemp : Min(MeasureTemp, MeasureTempMin)

[MeasureTempMax]
Measure=Calc
Formula=Max(MeasureTemp, MeasureTempMax)

[MeasureTempAvg]
Measure=Calc
Formula=MeasureTemp
AverageSize=3600

; ---------- Memory ----------
[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? (MeasureRAM / MeasureRAMTotal * 100) : 0

[MeasureRAMBar]
Measure=Calc
Formula=Max(MeasureRAMPct * #PBarW# / 100, 6)

[MeasureSwap]
Measure=SwapMemory

[MeasureSwapTotal]
Measure=SwapMemory
Total=1

[MeasureSwapPct]
Measure=Calc
Formula=MeasureSwapTotal > 0 ? (MeasureSwap / MeasureSwapTotal * 100) : 0

[MeasureSwapBar]
Measure=Calc
Formula=Max(MeasureSwapPct * #PBarW# / 100, 6)

; ---------- C: drive ----------
[MeasureCFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=10

[MeasureCTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=10

[MeasureCUsed]
Measure=Calc
Formula=MeasureCTotal - MeasureCFree

[MeasureCPct]
Measure=Calc
Formula=MeasureCTotal > 0 ? (MeasureCUsed / MeasureCTotal * 100) : 0

[MeasureCBar]
Measure=Calc
Formula=Max(MeasureCPct * #PBarW# / 100, 6)

[MeasureCRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=C:
; 3-sample average so the R/W bars glide instead of jumping
AverageSize=3

[MeasureCWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=C:
AverageSize=3

[MeasureVRAMVal]
Measure=Calc
Formula=MeasureVRAM

[MeasureCReadVal]
Measure=Calc
Formula=MeasureCRead

[MeasureCWriteVal]
Measure=Calc
Formula=MeasureCWrite

; Log10 of bytes/s for the R/W bars: 1 KB/s (3) .. ~3 GB/s (9.5), so idle noise stays flat
[MeasureCReadLog]
Measure=Calc
Formula=Log(Max(MeasureCRead, 1))
MinValue=3
MaxValue=9.5

[MeasureCWriteLog]
Measure=Calc
Formula=Log(Max(MeasureCWrite, 1))
MinValue=3
MaxValue=9.5

; Bar widths (px) for the R/W bars in the Storage card
[MeasureCReadBar]
Measure=Calc
Formula=Clamp((MeasureCReadLog - 3) / 6.5, 0, 1) * 56

[MeasureCWriteBar]
Measure=Calc
Formula=Clamp((MeasureCWriteLog - 3) / 6.5, 0, 1) * 56

; Peak-hold ticks: jump to the bar, then fall back 1 px per update
[MeasureCReadPeak]
Measure=Calc
Formula=Max(MeasureCReadBar, MeasureCReadPeak - 1)

[MeasureCWritePeak]
Measure=Calc
Formula=Max(MeasureCWriteBar, MeasureCWritePeak - 1)

[MeasureCReadTickW]
Measure=Calc
Formula=MeasureCReadPeak > 4 ? 2 : 0

[MeasureCWriteTickW]
Measure=Calc
Formula=MeasureCWritePeak > 4 ? 2 : 0
; ---------- Network (best = active internet adapter) ----------
[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeasureNetInTotal]
Measure=NetIn
Interface=Best
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Interface=Best
Cumulative=1

[MeasureLANIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[MeasureAdapter]
Measure=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=5
Timeout=2000
TimeoutValue=-1

[MeasureIP]
Measure=WebParser
URL=https://api.ipify.org
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=600
OnConnectErrorAction=[!SetOption MeterIP Text "Ext offline"]

; ---------- Wi-Fi (built-in WiFiStatus measure; row shown only while connected) ----------
; Windows 11 24H2+: needs Settings > Privacy & security > Location > "Let desktop apps access your location",
; otherwise WiFiStatus returns nothing and the row stays hidden.
[MeasureWiFiQuality]
Measure=WiFiStatus
WiFiInfoType=Quality
WiFiIntfID=#WiFiIntf#
MinValue=0
MaxValue=100
; quality is 0 when disconnected or when there is no Wi-Fi adapter; the row is part of Details, so stay hidden while collapsed.
; Only sets WiFiRowH; the panel height is computed by MeasureBgH.
IfCondition=(MeasureWiFiQuality > 0) && (#LumenCollapsed# = 0)
IfTrueAction=[!SetVariable WiFiRowH "23"][!ShowMeterGroup WiFi]
IfFalseAction=[!SetVariable WiFiRowH "0"][!HideMeterGroup WiFi]

; Windows maps signal quality linearly: 0% = -100 dBm, 100% = -50 dBm (so 100% means -50 dBm or better)
[MeasureWiFiDBm]
Measure=Calc
Formula=(MeasureWiFiQuality / 2) - 100

; signal bars like the Windows tray icon: 1..4
[MeasureWiFiBars]
Measure=Calc
Formula=(MeasureWiFiQuality <= 0) ? 0 : ((MeasureWiFiQuality >= 75) ? 4 : ((MeasureWiFiQuality >= 50) ? 3 : ((MeasureWiFiQuality >= 25) ? 2 : 1)))
; 1 bar = weak (amber), 2+ bars = accent colour
IfCondition=MeasureWiFiBars = 1
IfTrueAction=[!SetVariable WiFiColor "#TempWarnColor#"][!SetVariable WiFiBar1 "#TempWarnColor#"]
IfCondition2=MeasureWiFiBars >= 2
IfTrueAction2=[!SetVariable WiFiColor "#Accent1#"][!SetVariable WiFiBar1 "#Accent1#"]
IfCondition3=MeasureWiFiBars >= 2
IfTrueAction3=[!SetVariable WiFiBar2 "#Accent1#"]
IfFalseAction3=[!SetVariable WiFiBar2 "#TrackColor#"]
IfCondition4=MeasureWiFiBars >= 3
IfTrueAction4=[!SetVariable WiFiBar3 "#Accent1#"]
IfFalseAction4=[!SetVariable WiFiBar3 "#TrackColor#"]
IfCondition5=MeasureWiFiBars >= 4
IfTrueAction5=[!SetVariable WiFiBar4 "#Accent1#"]
IfFalseAction5=[!SetVariable WiFiBar4 "#TrackColor#"]

[MeasureWiFiSSID]
Measure=WiFiStatus
WiFiInfoType=SSID
WiFiIntfID=#WiFiIntf#

[MeasureWiFiPHY]
Measure=WiFiStatus
WiFiInfoType=PHY
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiAuth]
Measure=WiFiStatus
WiFiInfoType=AUTH
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiRate]
Measure=WiFiStatus
WiFiInfoType=TXRate
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiMbps]
Measure=Calc
Formula=MeasureWiFiRate / 1000000

; ---------- Battery (built-in Power plugin; row shown only while a battery is present) ----------
; Status: 0 = no battery, 1 = charging, 2 = critical, 3 = low, 4 = above low
[MeasureBattStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
UpdateDivider=5

[MeasureBattAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
UpdateDivider=5
IfCondition=MeasureBattAC = 1
IfTrueAction=[!SetVariable BattACLineText "On AC power"]
IfFalseAction=[!SetVariable BattACLineText "On battery"]

[MeasureBattPctRaw]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=5

; Percent reports 255 when there is no battery; clamp so the ring never overfills
[MeasureBattPct]
Measure=Calc
Formula=Min(MeasureBattPctRaw, 100)
MinValue=0
MaxValue=100

; Drives row visibility the same way MeasureWiFiQuality drives the Wi-Fi row (only sets BattRowH).
; Status 255 = unknown, treated as no battery.
[MeasureBattPresent]
Measure=Calc
Formula=(MeasureBattStatus > 0) && (MeasureBattStatus < 255) ? 1 : 0
IfCondition=(MeasureBattPresent = 1) && (#LumenCollapsed# = 0)
IfTrueAction=[!SetVariable BattRowH "23"][!ShowMeterGroup Battery]
IfFalseAction=[!SetVariable BattRowH "0"][!HideMeterGroup Battery]

; Panel height: single source of truth, placed after both row measures so it sees this update's values.
; (The old per-row BgH bangs baked the other row's height in at load time, so wifi + battery came out 23px short.)
[MeasureBgH]
Measure=Calc
Formula=(#LumenCollapsed# = 1) ? #MiniH# : (#FullH# + #WiFiRowH# + #BattRowH#)
DynamicVariables=1

; Ring/bar colors per charge: accent > 30%, amber 11-30%, red <= 10%
[MeasureBattColor]
Measure=Calc
Formula=MeasureBattPct
IfCondition=MeasureBattColor <= 10
IfTrueAction=[!SetVariable BattColor "#TempHotColor#"][!SetVariable BattFill "#TempHotColor#"]
IfCondition2=(MeasureBattColor > 10) && (MeasureBattColor <= 30)
IfTrueAction2=[!SetVariable BattColor "#TempWarnColor#"][!SetVariable BattFill "#TempWarnColor#"]
IfCondition3=MeasureBattColor > 30
IfTrueAction3=[!SetVariable BattColor "#Accent1#"][!SetVariable BattFill "#Accent1#"]


; ---------- Ring arcs ----------
; Rings are Shape arcs with round caps. Each ring needs the arc end point on a circle of radius 35
; around (42,42), starting at 12 o'clock: angle = value% of a full turn (kept below 360 so the arc never vanishes).
[MeasureCPUAng]
Measure=Calc
Formula=Clamp(MeasureCPU, 0.5, 99.9) / 100 * 2 * PI

[MeasureCPUX]
Measure=Calc
Formula=42 + 35 * Sin(MeasureCPUAng)

[MeasureCPUY]
Measure=Calc
Formula=42 - 35 * Cos(MeasureCPUAng)

[MeasureCPULarge]
Measure=Calc
Formula=MeasureCPUAng > PI ? 1 : 0

[MeasureTempAng]
Measure=Calc
Formula=Clamp(MeasureTemp, 0.5, 99.9) / 100 * 2 * PI

[MeasureTempX]
Measure=Calc
Formula=42 + 35 * Sin(MeasureTempAng)

[MeasureTempY]
Measure=Calc
Formula=42 - 35 * Cos(MeasureTempAng)

[MeasureTempLarge]
Measure=Calc
Formula=MeasureTempAng > PI ? 1 : 0

[MeasureGPUAng]
Measure=Calc
Formula=Clamp(MeasureGPU, 0.5, 99.9) / 100 * 2 * PI

[MeasureGPUX]
Measure=Calc
Formula=42 + 35 * Sin(MeasureGPUAng)

[MeasureGPUY]
Measure=Calc
Formula=42 - 35 * Cos(MeasureGPUAng)

[MeasureGPULarge]
Measure=Calc
Formula=MeasureGPUAng > PI ? 1 : 0

[MeasureDate]
Measure=Time
Format=%a %#d %b

[MeasureClockHM]
Measure=Time
Format=%H:%M

; ============================================================
;  STYLES
; ============================================================

[StyleLabel]
FontFace=#FontText#
FontSize=10
FontWeight=700
FontColor=#LabelColor#
StringCase=Upper
AntiAlias=1

[StyleValue]
FontFace=#FontText#
FontSize=12
FontWeight=600
FontColor=#TextColor#
AntiAlias=1

[StyleSmall]
FontFace=#FontText#
FontSize=11
FontColor=#LabelColor#
AntiAlias=1

[StyleBig]
FontFace=#Font#
FontSize=19
FontWeight=600
FontColor=#TextColor#
StringAlign=CenterCenter
AntiAlias=1

[StyleRingTrack]
Shape=Ellipse 42,42,35 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #TrackColor#

[StyleCore]
Y=228
H=22
BarOrientation=Vertical
BarColor=#Accent1#
SolidColor=#TrackColor#

[StyleTrackBar]
Shape=Rectangle 0,0,#PBarW#,7,3.5 | Fill Color #TrackColor# | StrokeWidth 0

; ============================================================
;  METERS
; ============================================================

[MeterBg]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0.5,0.5,(#PW#-1),[MeasureBgH],#Radius# | Fill LinearGradient BgGrad | StrokeWidth 1 | Stroke Color #Border#
BgGrad=135 | #BgColor# ; 0.0 | #BgColor2# ; 1.0

; ---------- Header: clock, date, uptime ----------
[MeterTime]
Meter=String
MeasureName=MeasureClockHM
FontFace=#Font#
FontSize=24
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
X=18
Y=6

[MeterDate]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDate
X=(#PW#-20)
Y=12
StringAlign=Right

[MeterUptime]
Meter=String
MeterStyle=StyleSmall
MeasureName=MeasureUptime
X=(#PW#-44)
Y=33
StringAlign=Right
Text=Up %1
ToolTipText=Windows uptime

[MeterCollapse]
Meter=String
MeterStyle=StyleValue
FontSize=13
X=(#PW#-20)
Y=30
StringAlign=Right
FontColor=#Accent1#
Text=☰
ToolTipText=Collapse / expand
LeftMouseUpAction=[!WriteKeyValue Variables LumenCollapsed (1-#LumenCollapsed#) "#@#Lumen\State.inc"][!Refresh]
DynamicVariables=1

; ---------- Host row: accent dot, host name, CPU name ----------
[MeterDot]
Meter=Shape
; Accent button: click cycles presets; Shape2 is an invisible 16x16 hit area, hover adds a ring.
X=14
Y=57
DynamicVariables=1
Shape=Ellipse 8,8,#DotR# | Fill LinearGradient DotGrad | StrokeWidth 0
DotGrad=0 | #Accent1# ; 0.0 | #Accent2# ; 1.0
Shape2=Ellipse 8,8,7.5 | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color #DotRing#
ToolTipText=Change accent color
LeftMouseUpAction=[!CommandMeasure MeasureAccentScript "CycleAccent()"]
MouseOverAction=[!SetVariable DotR 6][!SetVariable DotRing "#Accent1#"][!UpdateMeter MeterDot][!Redraw]
MouseLeaveAction=[!SetVariable DotR 5][!SetVariable DotRing "0,0,0,0"][!UpdateMeter MeterDot][!Redraw]

[MeterHost]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureHost
FontWeight=700
X=36
Y=54
W=110
ClipString=1

[MeterCPUName]
Meter=String
MeterStyle=StyleSmall
MeasureName=MeasureCPUName
X=(#PW#-20)
Y=55
W=150
ClipString=1
StringAlign=Right

; ---------- Weather (location is in the tooltip) ----------
[MeterWeather]
Meter=String
MeterStyle=StyleSmall
MeasureName=MeasureWIcon
MeasureName2=MeasureWTemp
MeasureName3=MeasureWDesc
MeasureName4=MeasureWHum
MeasureName5=MeasureWWind
MeasureName6=MeasureWWindUnit
MeasureName7=MeasureWWindDir
X=(#PW#/2)
Y=80
W=(#PW#-40)
ClipString=1
StringAlign=Center
FontColor=#TextColor#
Text=%1  %2  %3   H %4
; temperature stands out in the accent color
InlinePattern=^\S+\s+(\S+)
InlineSetting=Color | #Accent1#
InlineSetting2=Weight | 600
InlinePattern2=^\S+\s+(\S+)
ToolTipText=[MeasureWLoc]  ·  feels like [MeasureWFeels]  ·  wind [MeasureWWindDir] [MeasureWWind] [MeasureWWindUnit]#CRLF#Click for forecast
LeftMouseUpAction=["https://wttr.in/#WeatherLoc#?#WeatherUnits#"]
DynamicVariables=1

; ============================================================
;  CPU card (always visible)
; ============================================================
[MeterCardCPU]
Meter=Shape
X=10
Y=106
DynamicVariables=1
Shape=Rectangle 0.5,0.5,(#PW#-21),200,12 | Fill Color #CardColor# | StrokeWidth 1 | Stroke Color #CardBorder#

[MeterCPULabel]
Meter=String
MeterStyle=StyleLabel
X=62
Y=116
StringAlign=Center
Text=CPU

[MeterTempLabel]
Meter=String
MeterStyle=StyleLabel
X=(#PW#/2)
Y=116
StringAlign=Center
Text=Max Temp

[MeterGPULabel]
Meter=String
MeterStyle=StyleLabel
X=(#PW#-62)
Y=116
StringAlign=Center
Text=GPU

[MeterCPUTrack]
Meter=Shape
MeterStyle=StyleRingTrack
X=20
Y=136

[MeterCPURing]
Meter=Shape
X=20
Y=136
DynamicVariables=1
Shape=Arc 42,7,[MeasureCPUX],[MeasureCPUY],35,35,0,0,[MeasureCPULarge],0 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #CPURingColor# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=CPU since load  ·  min [MeasureCPUMin:0]%  ·  avg (1h) [MeasureCPUAvg:0]%  ·  max [MeasureCPUMax:0]%  ·  click: Task Manager

[MeterCPUText]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureCPU
X=62
Y=178
NumOfDecimals=0
Text=%1%

[MeterTempTrack]
Meter=Shape
MeterStyle=StyleRingTrack
X=(#PW#/2-42)
Y=136

[MeterTempRing]
Meter=Shape
X=(#PW#/2-42)
Y=136
DynamicVariables=1
Shape=Arc 42,7,[MeasureTempX],[MeasureTempY],35,35,0,0,[MeasureTempLarge],0 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #TempRingColor# | StrokeStartCap Round | StrokeEndCap Round
ToolTipText=Max temp since load  ·  min [MeasureTempMin:0]°  ·  avg (1h) [MeasureTempAvg:0]°  ·  max [MeasureTempMax:0]°

[MeterTempText]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureTemp
X=(#PW#/2)
Y=178
NumOfDecimals=0
Text=%1°

[MeterGPUTrack]
Meter=Shape
MeterStyle=StyleRingTrack
X=(#PW#-104)
Y=136

[MeterGPURing]
Meter=Shape
X=(#PW#-104)

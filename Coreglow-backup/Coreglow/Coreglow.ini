[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#@#Variables.inc"]
MouseOverAction=[!SetVariable Border "#Accent1#"][!UpdateMeter MeterBg][!Redraw]
MouseLeaveAction=[!SetVariable Border "#BorderColor#"][!UpdateMeter MeterBg][!Redraw]

[Metadata]
Name=Coreglow
Author=Stavros Antoniou
Information=Coreglow - modern system monitor: GPU, per-core load, C: drive, ping, LAN IP, top process, clock, theme sync, collapse.
Version=1.1
License=MIT

@Include=#@#Variables.inc
@Include2=#@#ThemeState.inc
@Include3=#@#Theme#IsLight#.inc

[Variables]
PW=320
PBarW=197
PingHost=1.1.1.1
FullH=691
MiniH=309
BgH=691
Border=#BorderColor#
; Wi-Fi row: WiFiRowH is 0 (hidden) or WiFiRowStep (connected); FullHWiFi = FullH + WiFiRowStep
WiFiRowStep=23
WiFiRowH=0
FullHWiFi=714
WiFiColor=#Accent1#
WiFiBar1=#TrackColor#
WiFiBar2=#TrackColor#
WiFiBar3=#TrackColor#
WiFiBar4=#TrackColor#

; ============================================================
;  MEASURES
; ============================================================

[MeasureTheme]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
RegValue=AppsUseLightTheme
UpdateDivider=5
IfCondition=(MeasureTheme = 1) && (#IsLight# = 0)
IfTrueAction=[!WriteKeyValue Variables IsLight 1 "#@#ThemeState.inc"][!Refresh]
IfCondition2=(MeasureTheme = 0) && (#IsLight# = 1)
IfTrueAction2=[!WriteKeyValue Variables IsLight 0 "#@#ThemeState.inc"][!Refresh]

[MeasureCollapsedInit]
Measure=Calc
Formula=#Collapsed#
UpdateDivider=-1
IfCondition=MeasureCollapsedInit = 1
IfTrueAction=[!HideMeterGroup Details][!SetVariable BgH #MiniH#][!UpdateMeter MeterBg][!Redraw]

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureTime]
Measure=Time
Format=%H:%M  ·  %a %#d %b

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m

[MeasureWeather]
Measure=WebParser
; empty WeatherLoc = wttr.in detects the location from the public IP; empty WeatherUnits = units of that region
URL=https://wttr.in/#WeatherLoc#?format=%c|%t|%C|%h|%w|%f|%l&#WeatherUnits#
CodePage=65001
RegExp=(?s)^(.*?)\s*\|\+?(.*?)\|\s*(.*?)\s*\|(.*?)\|\s*(\D*?)\s*(\d+)\s*(.*?)\|\+?(.*?)\|\s*(.*?)\s*$
; refresh every 15 minutes
UpdateRate=900
OnConnectErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]
OnRegExpErrorAction=[!SetOption MeterWeather Text "Weather unavailable"]

[MeasureWIcon]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureWTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWDesc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureWHum]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4

[MeasureWWindDir]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=5

[MeasureWWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=6

[MeasureWWindUnit]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=7
Substitute="km/h":"km"

[MeasureWFeels]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=8

[MeasureWLoc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=9
[MeasureCoresScript]
Measure=Script
ScriptFile=#@#Cores.lua
UpdateDivider=-1

[MeasureCPU]
Measure=CPU
Processor=0


[MeasureCPUName]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuName
; strip the codename, e.g. "Intel Core i7 2600 (Sandy Bridge)" -> "Intel Core i7 2600"
RegExpSubstitute=1
Substitute="^(.*?)\s*(?:\(.*\)|\b(?:Sandy Bridge|Ivy Bridge|Haswell|Broadwell|Skylake|Kaby Lake|Coffee Lake|Comet Lake|Rocket Lake|Alder Lake|Raptor Lake|Lynnfield|Clarkdale|Nehalem|Westmere|Gulftown|Bloomfield|Wolfdale|Yorkfield|Conroe|Penryn|Zen\+?|Zen [2-5]|Vermeer|Matisse|Raphael|Summit Ridge|Pinnacle Ridge|Piledriver|Bulldozer|Vishera|Trinity|Richland|Kaveri|Thuban|Deneb))\s*$":"\1"

[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
MinValue=0
MaxValue=100
IfCondition=(MeasureTemp >= #TempWarn#) && (MeasureTemp < #TempHot#)
IfTrueAction=[!SetOption MeterTempRing LineColor "#TempWarnColor#"]
IfCondition2=MeasureTemp < #TempWarn#
IfTrueAction2=[!SetOption MeterTempRing LineColor "#TempOk#"]

; ---------- Alerts ----------
; temp >= TempHot: ring blinks between TempHotColor and TempHotDim (1 = bright, 0 = dim, -1 = not hot)
[MeasureTempAlert]
Measure=Calc
Formula=(MeasureTemp >= #TempHot#) ? ((MeasureTempAlert = 1) ? 0 : 1) : -1
IfCondition=MeasureTempAlert = 1
IfTrueAction=[!SetOption MeterTempRing LineColor "#TempHotColor#"]
IfCondition2=MeasureTempAlert = 0
IfTrueAction2=[!SetOption MeterTempRing LineColor "#TempHotDim#"]

; CPU >= LoadAlert for LoadAlertSecs seconds: CPU ring + label turn red
[MeasureLoadHigh]
Measure=Calc
Formula=(MeasureCPU >= #LoadAlert#) ? Min(MeasureLoadHigh + 1, 9999) : 0
IfCondition=MeasureLoadHigh >= #LoadAlertSecs#
IfTrueAction=[!SetOption MeterCPURing LineColor "#TempHotColor#"][!SetOption MeterCPULabel Text "⚠ CPU"][!SetOption MeterCPULabel FontColor "#TempHotColor#"]
IfFalseAction=[!SetOption MeterCPURing LineColor "#Accent1#"][!SetOption MeterCPULabel Text "CPU"][!SetOption MeterCPULabel FontColor "#LabelColor#"]

[MeasurePower]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Power

[MeasureClock]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuSpeed

[MeasureTopProc]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Blacklist=_Total|Idle

[MeasureTopPct]
Measure=Calc
Formula=MeasureTopProc

; ---------- GPU (Windows counters, no extra software) ----------
[MeasureGPURaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0

[MeasureGPU]
Measure=Calc
Formula=Min(MeasureGPURaw, 100)
MinValue=0
MaxValue=100

[MeasureVRAM]
Measure=Plugin
Plugin=UsageMonitor
Alias=VRAM
Index=0

; ---------- Session statistics (tooltips) ----------
[MeasureCPUMin]
Measure=Calc
Formula=(Counter <= 2) ? MeasureCPU : Min(MeasureCPU, MeasureCPUMin)

[MeasureCPUMax]
Measure=Calc
Formula=Max(MeasureCPU, MeasureCPUMax)

[MeasureCPUAvg]
Measure=Calc
Formula=MeasureCPU
; rolling average over the last hour (3600 x 1s)
AverageSize=3600

[MeasureTempMin]
Measure=Calc
Formula=(Counter <= 2) || (MeasureTempMin <= 0) ? MeasureTemp : Min(MeasureTemp, MeasureTempMin)

[MeasureTempMax]
Measure=Calc
Formula=Max(MeasureTemp, MeasureTempMax)

[MeasureTempAvg]
Measure=Calc
Formula=MeasureTemp
AverageSize=3600

; ---------- Memory ----------
[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? (MeasureRAM / MeasureRAMTotal * 100) : 0

[MeasureRAMBar]
Measure=Calc
Formula=Max(MeasureRAMPct * #PBarW# / 100, 6)

[MeasureSwap]
Measure=SwapMemory

[MeasureSwapTotal]
Measure=SwapMemory
Total=1

[MeasureSwapPct]
Measure=Calc
Formula=MeasureSwapTotal > 0 ? (MeasureSwap / MeasureSwapTotal * 100) : 0

[MeasureSwapBar]
Measure=Calc
Formula=Max(MeasureSwapPct * #PBarW# / 100, 6)

; ---------- C: drive ----------
[MeasureCFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=10

[MeasureCTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=10

[MeasureCUsed]
Measure=Calc
Formula=MeasureCTotal - MeasureCFree

[MeasureCPct]
Measure=Calc
Formula=MeasureCTotal > 0 ? (MeasureCUsed / MeasureCTotal * 100) : 0

[MeasureCBar]
Measure=Calc
Formula=Max(MeasureCPct * #PBarW# / 100, 6)

[MeasureCRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=C:

[MeasureCWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=C:

[MeasureVRAMVal]
Measure=Calc
Formula=MeasureVRAM

[MeasureCReadVal]
Measure=Calc
Formula=MeasureCRead

[MeasureCWriteVal]
Measure=Calc
Formula=MeasureCWrite

; ---------- Network (best = active internet adapter) ----------
[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeasureNetInTotal]
Measure=NetIn
Interface=Best
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Interface=Best
Cumulative=1

[MeasureLANIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[MeasureAdapter]
Measure=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=5
Timeout=2000
TimeoutValue=-1

[MeasureIP]
Measure=WebParser
URL=https://api.ipify.org
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=600
OnConnectErrorAction=[!SetOption MeterIP Text "Ext offline"]

; ---------- Wi-Fi (built-in WiFiStatus measure; row shown only while connected) ----------
; Windows 11 24H2+: needs Settings > Privacy & security > Location > "Let desktop apps access your location",
; otherwise WiFiStatus returns nothing and the row stays hidden.
[MeasureWiFiQuality]
Measure=WiFiStatus
WiFiInfoType=Quality
WiFiIntfID=#WiFiIntf#
MinValue=0
MaxValue=100
; quality is 0 when disconnected or when there is no Wi-Fi adapter; the row is part of Details, so do nothing while collapsed
IfCondition=(MeasureWiFiQuality > 0) && (#Collapsed# = 0)
IfTrueAction=[!SetVariable WiFiRowH #WiFiRowStep#][!SetVariable BgH #FullHWiFi#][!ShowMeterGroup WiFi][!UpdateMeter *][!Redraw]
IfCondition2=(MeasureWiFiQuality <= 0) && (#Collapsed# = 0)
IfTrueAction2=[!SetVariable WiFiRowH 0][!SetVariable BgH #FullH#][!HideMeterGroup WiFi][!UpdateMeter *][!Redraw]

; Windows maps signal quality linearly: 0% = -100 dBm, 100% = -50 dBm (so 100% means -50 dBm or better)
[MeasureWiFiDBm]
Measure=Calc
Formula=(MeasureWiFiQuality / 2) - 100

; signal bars like the Windows tray icon: 1..4
[MeasureWiFiBars]
Measure=Calc
Formula=(MeasureWiFiQuality <= 0) ? 0 : ((MeasureWiFiQuality >= 75) ? 4 : ((MeasureWiFiQuality >= 50) ? 3 : ((MeasureWiFiQuality >= 25) ? 2 : 1)))
; 1 bar = weak (amber), 2+ bars = accent colour
IfCondition=MeasureWiFiBars = 1
IfTrueAction=[!SetVariable WiFiColor "#TempWarnColor#"][!SetVariable WiFiBar1 "#TempWarnColor#"]
IfCondition2=MeasureWiFiBars >= 2
IfTrueAction2=[!SetVariable WiFiColor "#Accent1#"][!SetVariable WiFiBar1 "#Accent1#"]
IfCondition3=MeasureWiFiBars >= 2
IfTrueAction3=[!SetVariable WiFiBar2 "#Accent1#"]
IfFalseAction3=[!SetVariable WiFiBar2 "#TrackColor#"]
IfCondition4=MeasureWiFiBars >= 3
IfTrueAction4=[!SetVariable WiFiBar3 "#Accent1#"]
IfFalseAction4=[!SetVariable WiFiBar3 "#TrackColor#"]
IfCondition5=MeasureWiFiBars >= 4
IfTrueAction5=[!SetVariable WiFiBar4 "#Accent1#"]
IfFalseAction5=[!SetVariable WiFiBar4 "#TrackColor#"]

[MeasureWiFiSSID]
Measure=WiFiStatus
WiFiInfoType=SSID
WiFiIntfID=#WiFiIntf#

[MeasureWiFiPHY]
Measure=WiFiStatus
WiFiInfoType=PHY
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiAuth]
Measure=WiFiStatus
WiFiInfoType=AUTH
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiRate]
Measure=WiFiStatus
WiFiInfoType=TXRate
WiFiIntfID=#WiFiIntf#
UpdateDivider=5

[MeasureWiFiMbps]
Measure=Calc
Formula=MeasureWiFiRate / 1000000

